<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Howling Warlocks Productions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Howling Warlocks Productions — site coming soon." />

  <style>
    :root {
      --navy: #26314f;
      --night: #0f1015;
      --mist: #e3f0f6;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--mist);

      /* Navy + Night background (no true black) */
      background:
        radial-gradient(
          900px 600px at 20% 15%,
          rgba(38, 49, 79, 0.75),
          transparent 60%
        ),
        radial-gradient(
          700px 500px at 80% 25%,
          rgba(227, 240, 246, 0.10),
          transparent 65%
        ),
        linear-gradient(
          180deg,
          var(--navy),
          var(--night) 65%
        );

      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* subtle filmic texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 30% 40%, rgba(255,255,255,0.05) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,0.04) 0 1px, transparent 2px);
      background-size: 280px 280px, 320px 320px;
      opacity: 0.22;
      mix-blend-mode: overlay;
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 32px;
      max-width: 720px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: 0.03em;
      color: var(--white);
    }

    .divider {
      width: 72px;
      height: 2px;
      margin: 26px auto;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(227,240,246,0.8),
        transparent
      );
    }

    p {
      margin: 0;
      font-size: 16px;
      line-height: 1.6;
      color: rgba(227,240,246,0.78);
    }

    .whisper {
      margin-top: 28px;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(227,240,246,0.55);
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: rgba(227,240,246,0.45);
      z-index: 1;
    }
  </style>
</head>

<body>
  <main>
    <h1>Howling Warlocks<br/>Productions</h1>

    <div class="divider"></div>

    <p>
      An Atlanta-Based Film Production.<br />
    </p>

    <div class="whisper">Coming soon</div>
  </main>

  <footer>
    © <span id="year"></span> Howling Warlocks Productions
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
