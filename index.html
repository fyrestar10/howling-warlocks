<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Howling Warlocks Productions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Howling Warlocks Productions — site coming soon." />

  <!-- Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #26314f;
      --night: #0f1015;
      --mist: #e3f0f6;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      color: var(--mist);
      background:
        radial-gradient(1000px 700px at 20% 15%, rgba(38,49,79,0.9), transparent 60%),
        radial-gradient(800px 600px at 80% 25%, rgba(227,240,246,0.14), transparent 65%),
        linear-gradient(180deg, var(--navy), var(--night) 70%);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    /* ===== STARFIELD LAYERS ===== */

    /* FAR STARS */
    body::before {
      content: "";
      position: fixed;
      inset: -15%;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 5% 10%,  rgba(227,240,246,0.55) 0 1px, transparent 2px),
        radial-gradient(circle at 15% 30%, rgba(227,240,246,0.6) 0 1.25px, transparent 2px),
        radial-gradient(circle at 25% 70%, rgba(227,240,246,0.5) 0 1px, transparent 2px),
        radial-gradient(circle at 35% 40%, rgba(227,240,246,0.6) 0 1.25px, transparent 2px),
        radial-gradient(circle at 45% 85%, rgba(227,240,246,0.55) 0 1px, transparent 2px),
        radial-gradient(circle at 55% 15%, rgba(227,240,246,0.65) 0 1.5px, transparent 2px),
        radial-gradient(circle at 65% 55%, rgba(227,240,246,0.6) 0 1.25px, transparent 2px),
        radial-gradient(circle at 75% 75%, rgba(227,240,246,0.5) 0 1px, transparent 2px),
        radial-gradient(circle at 85% 35%, rgba(227,240,246,0.6) 0 1.25px, transparent 2px),
        radial-gradient(circle at 95% 60%, rgba(227,240,246,0.55) 0 1px, transparent 2px);
      opacity: 0.45;
      animation: driftSlow 120s linear infinite;
    }

    /* MID STARS */
    body::after {
      content: "";
      position: fixed;
      inset: -15%;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 10% 45%, rgba(227,240,246,0.8) 0 1.75px, transparent 3px),
        radial-gradient(circle at 20% 20%, rgba(227,240,246,0.75) 0 1.5px, transparent 3px),
        radial-gradient(circle at 30% 65%, rgba(227,240,246,0.85) 0 2px, transparent 3px),
        radial-gradient(circle at 40% 30%, rgba(227,240,246,0.7) 0 1.5px, transparent 3px),
        radial-gradient(circle at 50% 80%, rgba(227,240,246,0.9) 0 2px, transparent 3px),
        radial-gradient(circle at 60% 40%, rgba(227,240,246,0.75) 0 1.5px, transparent 3px),
        radial-gradient(circle at 70% 15%, rgba(227,240,246,0.85) 0 2px, transparent 3px),
        radial-gradient(circle at 80% 60%, rgba(227,240,246,0.75) 0 1.75px, transparent 3px),
        radial-gradient(circle at 90% 30%, rgba(227,240,246,0.8) 0 1.75px, transparent 3px);
      opacity: 0.35;
      animation: driftMedium 80s linear infinite;
    }

    /* NEAR STARS (extra layer via wrapper) */
    .stars-near {
      position: fixed;
      inset: -15%;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 58%, rgba(227,240,246,0.95) 0 2.25px, transparent 4px),
        radial-gradient(circle at 28% 18%, rgba(227,240,246,0.85) 0 2px, transparent 4px),
        radial-gradient(circle at 46% 52%, rgba(227,240,246,0.9) 0 2.25px, transparent 4px),
        radial-gradient(circle at 63% 72%, rgba(227,240,246,0.8) 0 2px, transparent 4px),
        radial-gradient(circle at 78% 25%, rgba(227,240,246,0.9) 0 2.25px, transparent 4px),
        radial-gradient(circle at 88% 85%, rgba(227,240,246,0.85) 0 2px, transparent 4px);
      opacity: 0.25;
      animation: driftFast 55s linear infinite;
      z-index: 0;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes driftSlow {
      from { transform: translateY(0); }
      to   { transform: translateY(-60px); }
    }

    @keyframes driftMedium {
      from { transform: translateY(0); }
      to   { transform: translateY(-110px); }
    }

    @keyframes driftFast {
      from { transform: translateY(0); }
      to   { transform: translateY(-160px); }
    }

    /* ===== CONTENT ===== */
    main {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 32px;
      max-width: 720px;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: 0.12em;
      font-weight: 600;
      color: var(--white);
      text-transform: uppercase;
    }

    .divider {
      width: 72px;
      height: 2px;
      margin: 26px auto;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(227,240,246,0.85),
        transparent
      );
    }

    p {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(227,240,246,0.78);
    }

    .whisper {
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(227,240,246,0.55);
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(227,240,246,0.45);
      z-index: 2;
    }
  </style>
</head>

<body>
  <div class="stars-near"></div>

  <main>
    <h1>Howling Warlocks<br>Productions</h1>

    <div class="divider"></div>

    <p>
      An Atlanta-based film production.<br>
      New work is gathering. The site will follow.
    </p>

    <div class="whisper">Coming soon</div>
  </main>

  <footer>
    © <span id="year"></span> Howling Warlocks Productions
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
