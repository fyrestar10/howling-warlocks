<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Howling Warlocks Productions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Howling Warlocks Productions — site coming soon." />

  <!-- Montserrat font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #26314f;
      --night: #0f1015;
      --mist: #e3f0f6;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      color: var(--mist);

      /* Night + navy base */
      background:
        radial-gradient(
          900px 600px at 20% 15%,
          rgba(38, 49, 79, 0.75),
          transparent 60%
        ),
        radial-gradient(
          700px 500px at 80% 25%,
          rgba(227, 240, 246, 0.10),
          transparent 65%
        ),
        linear-gradient(
          180deg,
          var(--navy),
          var(--night) 65%
        );

      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Star / mist specks */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(227,240,246,0.8) 0 1px, transparent 2px),
        radial-gradient(circle at 28% 62%, rgba(227,240,246,0.6) 0 1px, transparent 2px),
        radial-gradient(circle at 46% 34%, rgba(227,240,246,0.7) 0 1px, transparent 2px),
        radial-gradient(circle at 63% 78%, rgba(227,240,246,0.5) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 21%, rgba(227,240,246,0.75) 0 1px, transparent 2px);

      background-size: 100% 100%;
      opacity: 0.35;
      mix-blend-mode: screen;
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 32px;
      max-width: 720px;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 62px);
      line-height: 1.05;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--white);
      text-transform: uppercase;
    }

    .divider {
      width: 72px;
      height: 2px;
      margin: 26px auto;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(227,240,246,0.85),
        transparent
      );
    }

    p {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      font-weight: 400;
      color: rgba(227,240,246,0.78);
    }

    .whisper {
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(227,240,246,0.55);
      font-weight: 500;
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(227,240,246,0.45);
      z-index: 1;
      font-weight: 400;
    }
  </style>
</head>

<body>
  <main>
    <h1>Howling Warlocks<br>Productions</h1>

    <div class="divider"></div>

    <p>
      An Atlanta-based film production.<br />
      New work is gathering. The site will follow.
    </p>

    <div class="whisper">Coming soon</div>
  </main>

  <footer>
    © <span id="year"></span> Howling Warlocks Productions
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
