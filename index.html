<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Howling Warlocks Productions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Howling Warlocks Productions — site coming soon." />

  <!-- Montserrat font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #26314f;
      --night: #0f1015;
      --mist: #e3f0f6;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
  font-family: "Montserrat", system-ui, sans-serif;
  color: var(--mist);

  background:
    radial-gradient(
      900px 600px at 20% 15%,
      rgba(38, 49, 79, 0.85),
      transparent 60%
    ),
    radial-gradient(
      700px 500px at 80% 25%,
      rgba(227, 240, 246, 0.12),
      transparent 65%
    ),
    linear-gradient(
      180deg,
      var(--navy),
      var(--night) 65%
    );

  display: grid;
  place-items: center;
  overflow: hidden;
  position: relative;
}

/* FAR STAR LAYER */
body::before {
  content: "";
  position: fixed;
  inset: -10%;
  pointer-events: none;

  background-image:
    radial-gradient(circle at 10% 20%, rgba(227,240,246,0.65) 0 1.5px, transparent 2px),
    radial-gradient(circle at 25% 70%, rgba(227,240,246,0.55) 0 1px, transparent 2px),
    radial-gradient(circle at 45% 35%, rgba(227,240,246,0.6) 0 1.25px, transparent 2px),
    radial-gradient(circle at 60% 80%, rgba(227,240,246,0.5) 0 1px, transparent 2px),
    radial-gradient(circle at 75% 15%, rgba(227,240,246,0.7) 0 1.5px, transparent 2px),
    radial-gradient(circle at 90% 55%, rgba(227,240,246,0.6) 0 1.25px, transparent 2px);

  opacity: 0.45;
  animation: driftSlow 90s linear infinite;
}

/* NEAR STAR LAYER */
body::after {
  content: "";
  position: fixed;
  inset: -10%;
  pointer-events: none;

  background-image:
    radial-gradient(circle at 18% 40%, rgba(227,240,246,0.85) 0 2px, transparent 3px),
    radial-gradient(circle at 38% 18%, rgba(227,240,246,0.75) 0 1.75px, transparent 3px),
    radial-gradient(circle at 58% 60%, rgba(227,240,246,0.8) 0 2px, transparent 3px),
    radial-gradient(circle at 72% 35%, rgba(227,240,246,0.7) 0 1.75px, transparent 3px),
    radial-gradient(circle at 85% 75%, rgba(227,240,246,0.9) 0 2px, transparent 3px);

  opacity: 0.35;
  animation: driftFast 60s linear infinite;
}

/* PARALLAX ANIMATION */
@keyframes driftSlow {
  from { transform: translateY(0); }
  to   { transform: translateY(-60px); }
}

@keyframes driftFast {
  from { transform: translateY(0); }
  to   { transform: translateY(-120px); }
}

  </style>
</head>

<body>
  <main>
    <h1>Howling Warlocks<br>Productions</h1>

    <div class="divider"></div>

    <p>
      An Atlanta-based film production.<br />
    </p>

    <div class="whisper">Coming soon</div>
  </main>

  <footer>
    © <span id="year"></span> Howling Warlocks Productions
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
