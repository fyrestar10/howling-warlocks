<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Howling Warlocks Productions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Howling Warlocks Productions — an Atlanta-based film production company." />
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #26314f;
      --night: #0f1015;
      --mist: #e3f0f6;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      color: var(--mist);
      background:
        radial-gradient(1100px 800px at 18% 12%, rgba(38,49,79,0.95), transparent 60%),
        radial-gradient(900px 700px at 82% 22%, rgba(227,240,246,0.16), transparent 65%),
        linear-gradient(180deg, var(--navy), var(--night) 72%);
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    /* ===== NAV ===== */
    .nav {
      position: fixed;
      top: 24px;
      right: 32px;
      display: flex;
      align-items: center;
      gap: 28px;
      z-index: 5;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .nav a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .nav a:hover {
      opacity: 1;
    }

    .nav .nav-cta {
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 999px;
      font-size: 11px;
    }

    .nav .nav-cta:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    /* ===== STARFIELD ===== */
    body::before {
      content: "";
      position: fixed;
      inset: -25%;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 5% 15%, rgba(227,240,246,0.55) 0 1px, transparent 2px),
        radial-gradient(circle at 25% 40%, rgba(227,240,246,0.6) 0 1.25px, transparent 2px),
        radial-gradient(circle at 45% 70%, rgba(227,240,246,0.5) 0 1px, transparent 2px),
        radial-gradient(circle at 65% 20%, rgba(227,240,246,0.6) 0 1.25px, transparent 2px),
        radial-gradient(circle at 85% 60%, rgba(227,240,246,0.55) 0 1px, transparent 2px);
      opacity: 0.45;
      animation: driftSlow 110s linear infinite;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -25%;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 15% 35%, rgba(227,240,246,0.8) 0 1.75px, transparent 3px),
        radial-gradient(circle at 35% 75%, rgba(227,240,246,0.85) 0 2px, transparent 3px),
        radial-gradient(circle at 55% 45%, rgba(227,240,246,0.75) 0 1.75px, transparent 3px),
        radial-gradient(circle at 75% 25%, rgba(227,240,246,0.85) 0 2px, transparent 3px);
      opacity: 0.35;
      animation: driftMedium 75s linear infinite;
    }

    .stars-near {
      position: fixed;
      inset: -25%;
      pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(227,240,246,0.95) 0 2px, transparent 4px),
        radial-gradient(circle at 50% 20%, rgba(227,240,246,0.85) 0 2px, transparent 4px),
        radial-gradient(circle at 80% 75%, rgba(227,240,246,0.9) 0 2.25px, transparent 4px);
      opacity: 0.25;
      animation: driftFast 50s linear infinite;
      z-index: 0;
    }

    @keyframes driftSlow {
      from { transform: translateY(0); }
      to   { transform: translateY(-95px); }
    }

    @keyframes driftMedium {
      from { transform: translateY(0); }
      to   { transform: translateY(-165px); }
    }

    @keyframes driftFast {
      from { transform: translateY(0); }
      to   { transform: translateY(-235px); }
    }

    /* ===== CONTENT ===== */
    main {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 32px;
      max-width: 720px;
    }

    h1 {
      margin: 0;
      font-size: clamp(40px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: 0.12em;
      font-weight: 600;
      color: var(--white);
      text-transform: uppercase;
    }

    .divider {
      width: 72px;
      height: 2px;
      margin: 26px auto;
      background: linear-gradient(90deg, transparent, rgba(227,240,246,0.85), transparent);
    }

    p {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: rgba(227,240,246,0.78);
    }

    .whisper {
      margin-top: 28px;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(227,240,246,0.55);
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(227,240,246,0.45);
      z-index: 2;
    }
  </style>
</head>

<body>
  <nav class="nav">
    <a href="/">Home</a>
    <a href="/about.html">About</a>
    <a href="/team.html">Our Team</a>
    <a href="/films.html">Films</a>
    <a href="/news.html">News</a>
    <a href="/contact.html" class="nav-cta">Contact</a>
  </nav>

  <div class="stars-near"></div>

  <main>
    <h1>Howling Warlocks<br>Productions</h1>
    <div class="divider"></div>
    <p>An Atlanta-based film production company.</p>
    <div class="whisper">Site Coming Soon</div>
  </main>

  <footer>
    © <span id="year"></span> Howling Warlocks Productions
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>

</html>
